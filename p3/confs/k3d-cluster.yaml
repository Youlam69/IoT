# k3d cluster used by scripts/setup.sh
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: iot
servers: 1
agents: 0

# Published so the Argo CD UI and the application are reachable straight from
# the host with no port-forward: k3d's load balancer proxies each host port to
# the matching NodePort inside the cluster.
ports:
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
  - port: 8888:30888
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
