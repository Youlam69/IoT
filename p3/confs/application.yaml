# What Argo CD deploys into dev, and the repo it watches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aelyakou-playground
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/EldritchGriffin/aelyakou-iot
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
