# The application Argo CD deploys into the dev namespace.
# Change v1 to v2 below and push to trigger a redeploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aelyakou-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aelyakou-playground
  template:
    metadata:
      labels:
        app: aelyakou-playground
    spec:
      containers:
        - name: playground
          image: eldergriffi/playground:v2
          ports:
            - name: http
              containerPort: 8888
          # Keeps curl from hitting the pod before the app is listening
          readinessProbe:
            httpGet:
              path: /
              port: http
