# ==========================================
# Application 1 (app1.com - 1 Replica)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-one
  template:
    metadata:
      labels:
        app: app-one
    spec:
      containers:
      - name: app-one
        image: hashicorp/http-echo
        args: ["-text=Hello from App ONE!", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-one-service
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: app-one
---
# ==========================================
# Application 2 (app2.com - 3 Replicas)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-two
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-two
  template:
    metadata:
      labels:
        app: app-two
    spec:
      containers:
      - name: app-two
        image: hashicorp/http-echo
        args: ["-text=Hello from App TWO (3 Replicas)!", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-two-service
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: app-two
---
# ==========================================
# Application 3 (Default Host - 1 Replica)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-three
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-three
  template:
    metadata:
      labels:
        app: app-three
    spec:
      containers:
      - name: app-three
        image: hashicorp/http-echo
        args: ["-text=Hello from App THREE (Default Host)!", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-three-service
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: app-three
---
# ==========================================
# Ingress Routing Rules
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  defaultBackend:
    service:
      name: app-three-service
      port:
        number: 80
  rules:
  - host: app1.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-one-service
            port:
              number: 80
  - host: app2.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-two-service
            port:
              number: 80
