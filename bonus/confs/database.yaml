# PostgreSQL and Redis for GitLab: chart 10 stopped bundling them.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgresql-password
  namespace: gitlab
stringData:
  password: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-postgresql
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 8Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-postgresql
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels: { app: gitlab-postgresql }
  template:
    metadata:
      labels: { app: gitlab-postgresql }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # POSTGRES_USER is a superuser, so GitLab's migrations can create the
          # pg_trgm and btree_gist extensions they need.
          env:
            - { name: POSTGRES_DB, value: gitlabhq_production }
            - { name: POSTGRES_USER, value: gitlab }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitlab-postgresql-password, key: password }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitlab-postgresql }
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-postgresql
  namespace: gitlab
spec:
  selector: { app: gitlab-postgresql }
  ports:
    - { port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels: { app: gitlab-redis }
  template:
    metadata:
      labels: { app: gitlab-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { name: redis, containerPort: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  selector: { app: gitlab-redis }
  ports:
    - { port: 6379, targetPort: redis }
