# GitLab chart values, trimmed for a single-node cluster.
global:
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false
  # amd64-only image, and nothing here needs object storage
  minio:
    enabled: false
  appConfig:
    artifacts: { enabled: false }
    lfs: { enabled: false }
    uploads: { enabled: false }
    packages: { enabled: false }

installCertmanager: false
nginx-ingress:
  enabled: false
registry:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false

# One replica each and small requests, so it fits on one node.
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 200m, memory: 1500Mi }
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 100m, memory: 800Mi }
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  # Backup/rake pod; it wants an object-storage secret we do not have
  toolbox:
    enabled: false
