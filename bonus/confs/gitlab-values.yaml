# GitLab chart values, trimmed for a single-node cluster: plain HTTP on
# *.gitlab.local, k3s's Traefik as the ingress, and none of the optional parts.
global:
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false
  # The bundled MinIO image is amd64-only, so it cannot run on arm64. Nothing
  # here needs object storage: git repos live in Gitaly, on a PVC.
  minio:
    enabled: false
  appConfig:
    artifacts: { enabled: false }
    lfs: { enabled: false }
    uploads: { enabled: false }
    packages: { enabled: false }

installCertmanager: false
nginx-ingress:
  enabled: false
registry:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false

# One replica each and small requests, so it fits on one node.
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 200m, memory: 1500Mi }
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 100m, memory: 800Mi }
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  # Backup/rake pod, and it wants an object-storage secret we no longer have
  toolbox:
    enabled: false
