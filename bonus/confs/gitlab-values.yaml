# GitLab chart values, trimmed for a single-node cluster: plain HTTP on
# *.gitlab.local, k3s's Traefik as the ingress, and none of the optional parts.
# PostgreSQL and Redis come from confs/database.yaml.
global:
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  # No object storage: git repos live in Gitaly, on a PVC.
  minio:
    enabled: false
  appConfig:
    artifacts: { enabled: false }
    lfs: { enabled: false }
    uploads: { enabled: false }
    packages: { enabled: false }
  psql:
    host: gitlab-postgresql
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password: { secret: gitlab-postgresql-password, key: password }
  redis:
    host: gitlab-redis
    port: 6379
    password: { enabled: false }

installCertmanager: false
nginx-ingress:
  enabled: false
registry:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false

# One replica each and small requests, so it fits on one node.
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 200m, memory: 1500Mi }
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 100m, memory: 800Mi }
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  # Backup/rake pod, and it wants an object-storage secret we do not have
  toolbox:
    enabled: false
