# GitLab chart values, trimmed for a single-node cluster: plain HTTP on
# *.gitlab.local, k3s's Traefik as the ingress, and none of the optional parts.
global:
  hosts:
    domain: gitlab.local
    https: false
  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false

installCertmanager: false
nginx-ingress:
  enabled: false
registry:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false

# One replica each and small requests, so it fits on one node.
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 200m, memory: 1500Mi }
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests: { cpu: 100m, memory: 800Mi }
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
