# Like p3's, but reading from the local GitLab through its in-cluster Service.
# The project must be public, so no credentials are needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aelyakou-playground
  namespace: argocd
spec:
  project: default

  source:
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/aelyakou-iot.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
