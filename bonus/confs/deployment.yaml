# The app Argo CD deploys. Change the tag and push to redeploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aelyakou-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aelyakou-playground
  template:
    metadata:
      labels:
        app: aelyakou-playground
    spec:
      containers:
        - name: playground
          image: eldergriffi/playground:v1
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: http
