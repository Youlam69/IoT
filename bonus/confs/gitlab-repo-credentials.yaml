# Only needed if the GitLab project is private.
# Create a token in GitLab (scope: read_repository), then:
#   sed -e "s|__USERNAME__|root|" -e "s|__TOKEN__|<token>|" \
#       bonus/confs/gitlab-repo-credentials.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-aelyakou-iot
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/aelyakou-iot.git
  username: __USERNAME__
  password: __TOKEN__
