apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app-one, port: { name: http } }
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app-two, port: { name: http } }
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app-three, port: { name: http } }
